output_dir: data/traces/knapsack/gemini-3-flash/
run_name: stateless
seed_start: 42
cache_db_path: ./cache/llm_cache.sqlite

task_families:
  - knapsack

agents:
  - name: stateless-gemini-3-flash
    persistent_state: false
    max_turns: 40
    timeout_s: 300
    max_tool_calls: 25
    llm:
      model: gemini/gemini-3-flash-preview
      cache_enabled: true
      max_concurrent_requests: 4