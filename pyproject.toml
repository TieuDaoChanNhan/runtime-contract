[project]
name = "codeact-runtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles==24.1.0",
    "litellm==1.81.1",
    "pydantic==2.12.5",
    "pyright==1.1.408",
    "pytest==9.0.2",
    "pyyaml==6.0.3",
    "pytest-asyncio==1.3.0",
    "python-dotenv==1.0.1",
    "rich==14.2.0",
    "nbqa==1.9.1",
    "isort==7.0.0",
    "ruff==0.14.13",
    "scipy==1.17.0",
    "smolagents[toolkit]==1.24.0",
    "matplotlib>=3.10.8",
    "jinja2>=3.1.6",
]

[tool.setuptools]
packages = ["codeact_runtime"]

[project.optional-dependencies]
train = [
    "transformers==4.57.6",
    "axolotl==0.13.2",
    "datasets==4.5.0",
    "trl==0.27.0",
    "accelerate==1.12.0",
    "bitsandbytes==0.49.1",
    "torchvision==0.25.0; sys_platform == 'linux'",
    "wandb>=0.24.0",
]
inference = [
    "vllm==0.17.1; sys_platform == 'linux'",
    "triton==3.6.0; sys_platform == 'linux'",
]
fa = [
    "flash-attn==2.8.3; sys_platform == 'linux' and python_version == '3.12'",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
flash-attn = [
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3%2Bcu128torch2.10-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.12'" },
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3%2Bcu128torch2.10-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'" },
]

[tool.uv]
conflicts = [
    [
        { extra = "train" },
        { extra = "inference" },
    ],
]
required-environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
override-dependencies = [
    "triton==3.6.0; sys_platform == 'linux'",
    "torch==2.10.0; sys_platform == 'linux'",
    "torchvision==0.25.0; sys_platform == 'linux'",
]
