base_model: Qwen/Qwen3-8B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: true

# QLoRA - 4-bit quantized base model
load_in_8bit: false
load_in_4bit: true
strict: false

# BitsAndBytes 4-bit config
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_use_double_quant: true
bnb_4bit_quant_type: nf4

# Dataset - CodeAct persistent state traces (assistant-only training)
datasets:
  - path: data/traces.jsonl
    type: chat_template
    field_messages: messages
    message_field_role: role
    message_field_content: content
    roles_to_train:
      - assistant

dataset_prepared_path: out/prepared_dataset_persistent
val_set_size: 0.04
output_dir: out/qwen3-8b-persistent

# LoRA config
adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_target_linear: false

# Sequence length - overridden at launch by train/train.sh's --max-seq-length
# (default 16384, see MAX_SEQ_LENGTH); this field is a template default and is
# not what the real seed-0/777/1337 runs used. Kept at the real value (16384)
# so reading this file directly isn't misleading - a stale 32768 here is what
# got copy-pasted into axolotl_llama31_8b_*.yaml and caused a real confound.
sequence_len: 16384
sample_packing: false
pad_to_sequence_len: true

# Training - batch_size=1, same as Mistral-7B-v0.3 and (now) Llama-3.1-8B
gradient_accumulation_steps: 16
micro_batch_size: 1
num_epochs: 3
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 1e-4
warmup_ratio: 0.03
weight_decay: 0.01

# Memory optimizations
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
flash_attention: true

# Logging and checkpoints
logging_steps: 1
save_strategy: epoch
eval_steps: 5
save_total_limit: 3

# Precision
bf16: true
tf32: true

# Wandb (offline on SLURM, synced later)
wandb_watch:
wandb_log_model:

# Misc
seed: 3407
