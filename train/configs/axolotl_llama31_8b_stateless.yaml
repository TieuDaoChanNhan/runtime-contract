base_model: meta-llama/Llama-3.1-8B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

# Llama-3.1-8B's tokenizer has no pad_token - use Meta's own reserved id.
special_tokens:
  pad_token: "<|finetune_right_pad_id|>"

# Base checkpoint's own chat-format tokens (<|eot_id|> etc.) are untrained -
# custom minimal template using only real trained tokens (BOS/EOS + plain-text roles).
chat_template: jinja
chat_template_jinja: train/configs/llama31_8b_chat_template.jinja

# QLoRA - 4-bit quantized base model
load_in_8bit: false
load_in_4bit: true
strict: false

# BitsAndBytes 4-bit config
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_use_double_quant: true
bnb_4bit_quant_type: nf4

# Dataset - CodeAct stateless traces (assistant-only training)
datasets:
  - path: data/traces.jsonl
    type: chat_template
    field_messages: messages
    message_field_role: role
    message_field_content: content
    roles_to_train:
      - assistant

dataset_prepared_path: out/prepared_dataset_stateless
val_set_size: 0.04
output_dir: out/llama31-8b-stateless

# LoRA config
adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_target_linear: false

# Fused linear cross-entropy - avoids OOM on the large-vocab logits tensor.
plugins:
  - axolotl.integrations.liger.LigerPlugin
liger_fused_linear_cross_entropy: true

# Sequence length - matches the main Qwen3-8B arm's real trained value (16384)
# and Mistral-7B-v0.3's config.
sequence_len: 16384
sample_packing: false
pad_to_sequence_len: true

# Training - batch_size=1, same as the other two arms
gradient_accumulation_steps: 16
micro_batch_size: 1
num_epochs: 3
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 1e-4
warmup_ratio: 0.03
weight_decay: 0.01

# Memory optimizations
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
flash_attention: false

# Logging and checkpoints
logging_steps: 1
save_strategy: epoch
eval_steps: 5
save_total_limit: 3

# Precision
bf16: true
tf32: true

# Wandb (offline on SLURM, synced later)
wandb_watch:
wandb_log_model:

# Misc
seed: 3407
